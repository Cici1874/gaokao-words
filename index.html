<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邪修单词</title>
<style>
  /* 错题本风格：暖白纸色、黑字、朱红强调 */
  :root {
    color-scheme: light;
    --bg: #f6f1e6; --paper: #fffdf8; --tint: #fbf6ec; --ink: #2b2723; --muted: #7b7267; --line: #e6dccb;
    --accent: #c0392b; --accent-soft: #f9e4df; --rest: #ebe3d3; --skip: #f8e8cc; --skip-ink: #8a5a14;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", STSong, SimSun, serif;
    --latin: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .page { max-width: 880px; margin: 0 auto; padding: 16px; }

  /* 页头 */
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font: 700 26px/1.2 var(--serif); letter-spacing: 1px; }
  #guide { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 14px; }
  .range { margin: 2px 0 12px; color: var(--muted); font-size: 13px; }

  /* 今天卡片 */
  .hero { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
  .kicker { margin: 0; color: var(--muted); font-size: 13px; }
  .hero-title { margin: 0; font: 700 32px/1.2 var(--serif); }
  .hero-note { margin: 2px 0 0; }
  .bar { height: 6px; overflow: hidden; border-radius: 3px; background: var(--line); }
  .bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .bar-label { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  #today-go { min-height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }

  /* 顺延按钮贴在顶部，往下翻词表时也点得到 */
  .actions {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    margin: 4px -16px 4px; padding: 8px 16px; background: var(--bg);
  }
  .actions button, .nav button { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .actions button:disabled, .nav button:disabled { opacity: .45; cursor: default; }
  .actions #postpone { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .status { color: var(--muted); font-size: 13px; }

  /* 月历 */
  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .nav h2 { margin: 0; font: 700 18px/1.3 var(--serif); font-variant-numeric: tabular-nums; }
  .nav button { min-width: 44px; font-size: 20px; line-height: 1; }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .weekdays div { padding: 2px 0; text-align: center; color: var(--muted); font-size: 12px; }
  .cell {
    display: flex; flex-direction: column; justify-content: space-between; min-height: 84px; padding: 6px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-align: left;
  }
  .cell.blank { background: transparent; border-color: transparent; color: var(--muted); cursor: default; }
  .cell.rest { background: var(--rest); color: var(--muted); }
  .cell.skipped { background: var(--skip); color: var(--skip-ink); border-style: dashed; }
  .cell.selected { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .date { align-self: flex-start; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cell.today .date { padding: 0 5px; border-radius: 6px; background: var(--accent); color: #fff; }
  .cell-unit { color: var(--muted); font-size: 12px; }
  .count { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .count small { margin-left: 1px; color: var(--muted); font-size: 11px; font-weight: 400; }
  .note { font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 3px; vertical-align: -1px; }
  .legend .k-today::before { background: var(--accent); }
  .legend .k-rest::before { background: #d9cfba; }
  .legend .k-skip::before { background: var(--skip); border: 1px dashed var(--skip-ink); }

  /* 当天详情 */
  .detail { margin-top: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); scroll-margin-top: 64px; }
  .detail h2 { margin: 0; font: 700 24px/1.25 var(--serif); }
  .detail h3 { margin: 18px 0 2px; font-size: 15px; }
  .detail p { margin: 2px 0; }
  .summary-line { color: var(--muted); }

  /* 词表：单词、音标一行，释义一行；宽屏排两列 */
  .words { list-style: none; margin: 0; padding: 0; }
  .words li { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .words li:last-child { border-bottom: 0; }
  .w { margin-right: 8px; font: 700 18px/1.3 var(--latin); overflow-wrap: anywhere; }
  .ipa { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .def { display: block; margin-top: 1px; overflow-wrap: anywhere; }

  /* 折叠块：故事和旧词都用它 */
  details { margin-top: 8px; border-radius: 10px; background: var(--tint); }
  summary { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; font-weight: 600; cursor: pointer; touch-action: manipulation; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; color: var(--accent); font-size: 18px; line-height: 1; transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details .words { padding: 0 12px 4px; }

  /* 故事：像读书页，答案用朱红 */
  .story { margin-top: 18px; border: 1px solid var(--line); }
  .story summary { font-family: var(--serif); font-size: 16px; }
  .story-body { padding: 2px 16px 10px; }
  .story-body p { margin: 0 0 12px; font: 16.5px/2 var(--serif); }
  .filled { padding: 0 2px; border-bottom: 1.5px solid var(--accent); color: var(--accent); font: 600 16.5px/1 var(--latin); }
  .hint { color: var(--muted); font: 12.5px/1 var(--sans); white-space: nowrap; }

  /* 弹窗：盖住整个页面，内容太长时在框里滚动 */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(43, 39, 35, .5); }
  .overlay[hidden] { display: none; }
  .dialog { display: flex; flex-direction: column; width: 100%; max-width: 480px; max-height: 100%; padding: 18px; border-radius: 14px; background: var(--paper); }
  .dialog h2 { margin: 0 0 8px; font: 700 20px/1.3 var(--serif); }
  .dialog h3 { margin: 12px 0 4px; font-size: 15px; }
  .dialog-body { min-height: 0; overflow-y: auto; }
  .dialog-body p { margin: 0 0 4px; }
  .dialog-body ul { margin: 0; padding-left: 20px; }
  #dialog-close { flex: none; min-height: 46px; margin-top: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }

  @media (min-width: 720px) {
    .page { padding: 24px; }
    .actions { margin: 4px -24px; padding: 8px 24px; }
    .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; }
    .hero-action { grid-column: 1 / -1; justify-self: start; min-width: 200px; padding: 0 24px; }
    .words { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; }
    .words li:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
  }

  /* 手机：格子窄，只留日期和词量 */
  @media (max-width: 640px) {
    .page { padding: 12px 16px; }
    .weekdays, .grid { gap: 3px; }
    .cell { min-height: 58px; padding: 4px 5px; border-radius: 8px; }
    .cell-unit { display: none; }
    .count { font-size: 13px; }
    .count small { font-size: 10px; }
    .note { font-size: 11px; }
    .hero-title { font-size: 28px; }
    .detail { padding: 14px; }
    .story-body { padding: 2px 13px 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    summary::before { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="title-row">
    <h1>邪修单词</h1>
    <button id="guide">使用指南</button>
  </div>
  <p class="range" id="range"></p>

  <section class="hero" aria-label="今天">
    <div>
      <p class="kicker" id="hero-kicker"></p>
      <p class="hero-title" id="hero-title"></p>
      <p class="hero-note" id="hero-note"></p>
    </div>
    <div>
      <div class="bar"><span id="hero-bar"></span></div>
      <p class="bar-label" id="hero-progress"></p>
    </div>
    <button class="hero-action" id="today-go"></button>
  </section>

  <div class="actions">
    <button id="postpone"></button>
    <button id="undo">撤销</button>
    <span class="status" id="status"></span>
  </div>

  <div class="nav">
    <button id="prev" aria-label="上个月">‹</button>
    <h2 id="month"></h2>
    <button id="next" aria-label="下个月">›</button>
  </div>
  <div class="weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
  <div class="grid" id="grid"></div>
  <p class="legend"><span class="k-today">今天</span><span class="k-rest">休息</span><span class="k-skip">已顺延</span></p>

  <div class="detail" id="detail"></div>
</div>

<!-- 使用指南和更新记录共用这个弹窗 -->
<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <div class="dialog-body" id="dialog-body"></div>
    <button id="dialog-close">知道了</button>
  </div>
</div>

const STORIES = {"1":{"title":"我妈出国记","paragraphs":[["我妈第一次出国，报了一个十天的",["Europe","欧洲"],"",["tour","旅行"],"团。团费是她攒了三年的钱，本来存在银行里吃",["interest","利息"],"的。"],["出发前一晚，她往箱子里塞了",["a dozen","一打"],"午餐肉罐头。我说欧洲有饭吃，她说：「外国的饭你吃过？没吃过你凭什么说有饭吃？」无法反驳。她管这箱罐头叫「出国的",["capital","资本"],"」。"],["她还在某宝的",["website","网站"],"上下单了一把「德国进口」的",["a can opener","开罐器"],"，理由是去德国当然要用德国货。到货一看，产地义乌。"],["办护照的时候，工作人员让她用",["capitals","大写字母"],"把名字拼音写一遍。她写了二十分钟，写完叹了口气：「外国人写个字真费劲。」"],["上了飞机，我妈拦住一位",["stewardess","女乘务员"],"：「姑娘，麻烦帮我",["fetch","去拿来"],"一双筷子。」乘务员愣了三秒，还真给她找来了。从那一刻起，我妈对这家航空公司产生了浓厚的",["interest","兴趣"],"，回国就办了会员卡。"],["到了法国的",["capital","首都"],"，全团去吃法餐。蜗牛端上来的那一刻，我妈默默打开了第一个罐头。"],["整整十天，她的每一句「外国饭不行」，都",["accompany","伴随"],"着一声开罐头的「咔」。"],["罐头的",["quantity","数量"],"刚刚好，最后一顿吃完最后一罐。导游说他带团十五年，没见过这么精准的",["operation","操作"],"。导游去年刚做完胃",["operation","手术"],"，三个月没碰过重口的东西，一路盯着罐头咽口水。最后一天，我妈偷偷塞给了他一罐。"],["团里",["dozens","几十"],"个阿姨开始",["everywhere","到处"],"打听罐头在哪买的。到了最后两天，局面变成我妈拿着开罐器，",["accompany","陪同"],"全团一起吃罐头。"],["旅行",["conclusion","结束"],"那天，她在家族群里发了一段话：「欧洲挺好，就是饭不行。」这是她这趟旅行唯一的",["conclusion","结论"],"。"],["不过她说下次还去。「下次带辣酱，那个",["better","更好"],"。」"]]},"2":{"title":"有请领导","paragraphs":[["我舅三十九岁，在陕北的",["oilfield","油田"],"上班，天天在",["microscope","显微镜"],"底下看石头。他",["seldom","很少"],"说话，全家一年听不到他二十句。他的话都说给一只养了十五年的",["tortoise","乌龟"],"听，那只龟叫「领导」。"],["今年他要结婚了。",["wedding","婚礼"],"定在周三，是个",["workday","工作日"],"，我姥姥翻黄历定的。两家为酒席桌数吵了三个月。"],["婚庆公司的",["head","负责人"],"王哥，也是全县最贵的司仪。他拿来一张",["form","表格"],"，让新人选婚礼的",["form","形式"],"：中式、西式、草坪式。我舅在「戒童」一栏写了两个字：领导。"],["王哥问：「哪位领导？」"],["我舅说：「我养的龟。」"],["王哥沉默很久，加了八百块。"],["周三一早，车队准备",["head","前往"],"舅妈家，我舅怀里抱着领导。"],["典礼开始，王哥声音发颤：「茫茫宇宙，新郎是一颗孤独的",["planet","行星"],"！这份爱，跨越了",["the Atlantic Ocean","大西洋"],"！」"],["我妈小声说：「他俩家就隔十七公里。」"],["「下面有请戒童——领导！」"],["我二姨夫腾地站起来，掌都鼓上了。"],["领导背着戒指袋，从舞台那头开始爬。爬了十分钟，走了一米。全场盯着一只龟，比看春晚还认真。这时表弟一屁股坐到干冰机的",["switch","开关"],"上，白雾轰地涌出。"],["雾散了，领导没了，戒指也没了。全场",["totally","完全地"],"安静了。"],["王哥只好",["switch","转换"],"语气：「各位来宾，请低头，找领导！」"],["这下两家人不得不",["unite","团结"],"起来。姥姥和亲家母头碰头钻桌底，舅妈提着婚纱满地爬。"],["最后舅妈在三号桌底下找到了领导，它正对着一摊",["beer","啤酒"],"发呆。"],["戒指回来了。王哥说新郎用左手才上镜，可我舅是个",["right-handed","惯用右手的"],"人，低着",["head","头"],"戴了三回没戴上。"],["舅妈说：「换右手。」他换了，一下就戴上了。"],["王哥让新郎说两句。全家没抱希望。"],["我舅憋了半天：「十五年了，我的话都说给它听。以后说给你听。」"],["我姥姥哭了。我二姨夫又站了起来，这回站对了。"]]},"3":{"title":"寿星吃了没","paragraphs":[["我爷爷今年八十，住的窑洞就是他的",["birthplace","出生地"],"，一辈子没挪过窝。他养蜂种地，脾气大，我奶奶管他叫",["volcano","火山"],"：一粒",["pea","豌豆"],"大的事，他都能喷半天。"],["大伯在县城机关上班，这回拍板给爷爷大办寿宴。"],["爷爷说：「不办。」"],["大伯说：「爸，孝顺这事，当儿女的都是",["bound","有义务的"],"。」"],["爷爷刚要喷，奶奶按住了他：「孩子一片心。」"],["寿宴那天，",["scores","许多"],"亲戚开车进村，把小路堵了半里地。院子里摆了八桌",["abundant","丰富的"],"酒菜。墙角蹲着一只",["bound","被绑的"],"大公鸡，爷爷养了三年，大伯说做压轴菜。"],["大伯还给爷爷买了件",["jacket","夹克"],"，一千二百九十九，非让他穿上，吊牌不许摘。全村老头都来翻吊牌，嘴上说「不值」，可谁心里不",["envy","羡慕"],"？"],["堂哥抱着",["guitar","吉他"],"上场，要弹生日歌。爷爷问我：「弹棉花的也请了？」"],["大伯拿起话筒：「",["personally","就自己而言"],"，我认为这场",["celebration","庆祝"],"有两层意义。第一，",["strengthen","加强"],"家族凝聚力……」"],["爷爷又问我：「开会呢？」"],["讲完话开始拍视频。三十多口人举着手机，让爷爷左转、笑一个、把吊牌露出来。拍完人人低头修图，能把寿星本人",["ignore","忽视"],"得干干净净。"],["开席半小时，有人喊：「鸡呢？」"],["绳子在地上，鸡没了。全家出动，满村找鸡。又过了二十分钟，堂哥才问：「爷爷呢？」"],["我在村口的",["stream","小溪"],"边找到了他。他坐在石头上，吊牌还挂在背后，鸡卧在脚边。"],["我以为他要发火。他没有。"],["「你大伯小时候在这儿摸鱼，摸到天黑，回家头一句是：『爹，你吃了没？』今天拍了我三百张，没一个人问这句。」"],["我说：「爷爷，你吃了没？」"],["他愣了一下，从怀里掏出半个馍和一小罐",["honey","蜂蜜"],"：「没吃。你也没吃吧？」"],["远处大伯在喊：「找到鸡了没有？」"],["爷爷把馍掰成三块，一块给我，一块自己吃，一块扔给鸡。"],["「它也没吃。」"]]},"4":{"title":"同桌的拔河大业","paragraphs":[["高二年级要办拔河",["tournament","锦标赛"],"，定在运城苹果",["ripen","成熟"],"的时候，冠军奖一箱。"],["我同桌张小满，一米五三，九十斤，主动要当教练。"],["「你",["imagine","想象"],"一下，」她拍桌子说，「全年级最瘦的班，把一班拖过线。」"],["全班看了看十一个男生的胳膊，觉得输才是",["likely","很可能的"],"结果。"],["辣条是我们班的流通",["currency","货币"],"，一根换一次擦黑板，三根换一个靠窗的座位。她掏出存了一学期的两大包，全班当场效忠。"],["绳子在器材",["warehouse","仓库"],"里，学校不",["permit","允许"],"学生放学后进去。她去找看门的李大爷",["chat","聊天"],"，从他孙子聊到他的腰，聊了三天。大爷说：「钥匙不能给。后窗坏了，我是没看见。」"],["每天晚饭后，全班从后窗",["climb","爬"],"进去，蹲",["inside","在里面"],"练发力。规矩只有一条：不许",["litter","乱丢杂物"],"。她还手写了一张「训练",["permit","许可证"],"」贴在门背后，盖着橡皮刻的小熊章。"],["",["however","然而"],"，第五天出事了。年级主任来拿哨子，一进门踩到一地辣条袋子。"],["张小满撕下那张纸，双手递上。主任看了半天：「这么",["absurd","荒谬的"],"东西你也敢拿出来？」顿了顿，「这章你自己刻的？刻得还挺好。」罚全班捡完袋子，没往上报。"],["决赛对一班。全班站",["beneath","在…下方"],"主席台等哨声，我摘下手套，才发现里面缝了一层",["cotton","棉花"],"。我问哪来的，张小满打了个喷嚏：「别问。」"],["后来才知道，她把自己的新被子拆了。"],["一班用五秒钟把我们拖过了线。张小满被拖出去三米，绳子还攥在手里。"],["第二名没有奖品。第二天，李大爷拎着一袋苹果站在教室门口：「自家树上的。」他说在学校看了十一年门，头一回有人问他腰还疼不疼。"],["张小满愣住了。她问那句话，本来只是为了钥匙。"],["她啃着苹果说：「明天我再去找他。」"],["「还要钥匙？」"],["「不要了。问问他的腰。」"]]},"5":{"title":"三号窗口保卫战","paragraphs":[["新校长上任，头一把火烧到食堂。校报头版的",["headline","大字标题"],"写着：「告别排队，全面",["self-service","自助"],"」。"],["改革",["first","第一"],"天，鸡腿只有一盆，高一和高三的男生眼看就要在盆前",["wrestle","摔跤"],"。喇叭里放着校长特批的午间",["concert","音乐会"],"，全被盘子声盖住了。"],["班主任老郝教语文，却是全校最抠时间的人，兜里常年揣一块",["stopwatch","秒表"],"，全班吃饭都被他掐过表。那天他不看鸡腿，直奔三号窗口。"],["三号窗口是王师傅的刀削面，削了二十八年。现在窗口拆了，换成一台",["electric","电的"],"削面机，一天能",["produce","生产"],"八百碗。新规定要厨师",["qualification","资格"],"证，王师傅没有，被调去洗碗。"],["老郝对着拆空的窗口站了很久：「这儿该建个",["memorial","纪念馆"],"。」"],["他打了一碗机器面。面粗得像筷子，汤清得能照见人，上面漂着一片白菜。"],["「再加一勺水，这片白菜就",["drown","淹死"],"了。」他放下筷子，「不能这么",["betray","辜负"],"山西人。」"],["当晚他做了一张",["chart","图表"],"，横轴是日期，纵轴是倒掉的面，打算向校长",["expose","揭露"],"真相。校长说：「数据不错。证呢？」"],["之后老郝中午总消失。我们跟踪他，发现他蹲在洗碗间后门，捧着一碗王师傅偷偷削的面。"],["「别告诉别人。」他说。"],["他万万没想到，课代表会",["betray","出卖"],"他。第二天后门排了五十个学生，校长也闻着味儿来了，端着碗站着吃完，一句话没说。"],["临走他才开口：「人可以回来，证得补。」"],["王师傅五十八岁，捧着考试书手直抖。老郝拿出对付我们的办法，每晚陪他在洗碗间",["recite","背诵"],"考点。"],["王师傅考了六十一分，压线过。"],["窗口重开那天，老郝排在最前面。我们这才听说，他高三那年家里穷，王师傅总给他多舀一勺卤。"],["这一勺，又来了。"],["老郝掏出秒表看了看，又揣了回去。"],["那碗面，他吃了二十分钟。"]]},"6":{"title":"我爸的钱包失踪案","paragraphs":[["县供热公司让我爸",["manage","管理"],"仓库，一干就是二十年。他和",["colleague","同事"],"老郭也较了二十年的劲：谁到得早，谁的茶缸大，谁桌上的绿植活得久。"],["我爸那盆绿萝早就是",["dead","死的"],"了，他还天天浇水，说它每个",["cell","细胞"],"都在坚持。老郭路过点评：「你这屋的",["ecology","生态"],"，就靠你一个人喘气。」"],["这个月公司来了个",["Russian","俄国人"],"，叫伊万，谈锅炉配件。两人都想给经理",["impress","留下深刻印象"],"，连夜自学",["Russian","俄语"],"。第二天老郭冲上去：「哈拉少！」我爸跟上：「哈拉少哈拉少！」多一个，算赢。"],["伊万愣了一下：「你们吃了没？」人家在太原住了八年。"],["晚上陪客，去县城唯一的",["bar","酒吧"],"。门口学大城市，给每人套一个",["admission","准许进入"],"的手环。我爸说：「我又不是鸽子。」台上自称",["musician","音乐家"],"的长发男子一开嗓，我爸认出来了：上礼拜来修暖气的小刘。"],["桌上端来一根",["bar","条状物"],"，我爸研究半天，问这是吃的还是用的。服务员说：「手工巧克力，三十八。」我爸一摸口袋，",["wallet","钱包"],"没了。"],["老郭抢着买单，笑得很开。"],["那钱包我爸午睡都压在头底下。老郭常笑他：「里头才三十七块，连根巧克力都买不起，还用得着拿命",["defend","保卫"],"？」可这回他真急了，沿路拦住每一个",["passer-by","过路人"],"，又把自己关进仓库的小黑屋，活像一间",["cell","牢房"],"。"],["我妈说：「全县翻一遍，你找得着？」我爸说：「我会",["manage","设法做到"],"。」"],["第三天，老郭踩上凳子，从文件柜",["top","顶部"],"拿下钱包：「那天你怕遇上小偷，自己藏的。我看着你藏的。」"],["我爸：「你咋不早说！」"],["老郭：「这是我这辈子最快乐的两天。本来想憋到周末，结果打开看了一眼。」"],["钱包里有三十七块，还有一张折得发白的画：一匹",["horse","马"],"，五条腿，旁边写着「爸爸属这个」。我七岁画的。"],["第二天，我爸桌上多了一盆新绿萝。老郭说：「这回是活的，别再输了。」"]]},"7":{"title":"我室友的五点起床计划","paragraphs":[["月考前七天，我室友贺佳在床头贴了一张",["revision","复习"],"计划：五点起，十二点睡，中间不碰手机。"],["我说：「这种人不",["exist","存在"],"。」她说：「从明天起就有了。」"],["第二天五点，她真起了。坐起来，又睡着了。"],["第三天她换战术：一困就去楼道",["skip","跳绳"],"，说这样血才能",["flow","流动"],"起来，知识才上得了脑子。楼下宿舍以为地震了，宿管阿姨上来没收了绳子，",["therefore","因此"],"知识停在了脖子以下。"],["她的英语错题本第一页，是上回的表格题。让填",["nationality","国籍"],"，她写「山西」。老师让她改，她改成「山西省」。"],["选择题她也有绝招：把答案写成",["ambiguous","模棱两可的"],"字母，B 和 D 怎么看都行。老师回了她一个同样看不清的分数，像 62，也像 82。"],["背到世界史，她趴在桌上：「那么大一个",["empire","帝国"],"，最后连",["France","法国"],"都保不住，我凭什么保住班里前二十？」"],["地理书上说，",["Pacific","太平洋的"],"风暴在西边叫",["typhoon","台风"],"，大西洋的叫",["hurricane","飓风"],"，其实是一种东西。她点头：「跟我一样。在家叫宝，在学校叫贺佳同学，考砸了叫那个谁。」"],["考前最后一晚，熄灯后她的被窝亮着光，还飘出一股烤",["squid","鱿鱼"],"味。我们以为她在偷偷卷，掀开一看：一手吃的，一手偷藏的手机。屏幕上是张天气图，一条红线正往福建爬。"],["她盯着红线，开始",["count","数数"],"：「还有四百公里，三百五……」"],["我问她这是干吗。她半天才说，她爸跑长途，家里唯一的",["vehicle","车辆"],"是一台十三米的大货车，这个月在福建拉货。手里那袋吃的是她爸捎回来的，一晚上只舍得吃一根。"],["成绩出来，总分还是老样子，只有地理那道风暴大题，全班就她满分。老师问她怎么背的。她说：「就那么背的。」"],["晚上她爸打来电话，问考得咋样。"],["她说还行，然后问：「你那边刮风不？」"]]},"8":{"title":"奶奶不能停","paragraphs":[["我奶奶六十八岁，是小区「",["youth","青春"],"舞蹈队」的创始人兼最高",["leader","领导人"],"。每天",["sunset","日落"],"准时集合，比学校打铃还准。"],["她年轻时是县",["athletics","田径"],"队的，扔",["softball","垒球"],"破过全县纪录，后来在供销社站了三十年",["counter","柜台"],"，练出一副隔两条街能喊住小偷的嗓子。这两件事我们全家都会背。"],["今年街道办比赛，奶奶急了。隔壁小区刘奶奶的闺女在",["Australia","澳大利亚"],"，寄来进口音箱，还请了个跳街舞的",["youth","青年"],"当教练。"],["奶奶一拍桌子：「明年我",["might","可能"],"就跳不动了，这回必须",["seize","抓住"],"机会！」"],["曲目定了《",["desert","沙漠"],"骆驼》。她半夜加练，嫌开灯费电，点根",["candle","蜡烛"],"，影子在墙上扭。我起夜看见，魂差点飞了。"],["她转圈摔了一跤，我爸连夜买了个电动车",["helmet","头盔"],"。她真戴着跳。"],["队里最大的麻烦是赵奶奶，永远慢半拍。有人劝换掉她，奶奶眼一瞪：「咱队的规矩，绝不",["desert","遗弃"],"一个姐妹！」"],["比赛那天",["temperature","温度"],"零下六度。社区医生给大家量",["blood","血"],"压，奶奶高压一百六。医生不让上，她说：「这是激动，不是病。再说骆驼走得慢。」"],["我用手机连音箱放音乐。跳到一半，我妈打来电话，音乐断了，音箱里传出她的声音：「作业写完没有？」"],["台下三百",["audience","观众"],"笑翻了。我手抖，连不上。全队僵住，赵奶奶也停了，直直盯着我奶奶的后背。"],["奶奶回头看她一眼，扯开嗓子喊：「一二三四！二二三四！」三十年的嗓子，比进口音箱还响。全队跟着跳完，拿了二等奖。"],["后来我才知道，赵奶奶耳朵聋了三年，从没听见过音乐。她是看着我奶奶的后背跳的，所以慢半拍。全队只有奶奶知道。"],["下台时，赵奶奶大声说：「今天这音乐真好！」"],["奶奶嗓子哑了，使劲点头。"],["第二天傍晚，她照样站最前面，背挺得更直。她说，后面有人要看。"]]},"9":{"title":"小姨相亲作战室","paragraphs":[["我小姨三十五岁，在太原教初中，站了十三年",["platform","讲台"],"，什么调皮学生都治得住，就是治不住我姥姥。"],["寒假她一回县城，姥姥就成立了「作战室」：饭桌上摊开亲戚名单，目标",["per","每"],"周两场。只要姥姥是",["awake","醒着的"],"，就在打电话。早上六点她还要敲小姨的门，说是",["awake","唤醒"],"她的危机感。"],["小姨说：「妈，我",["pressure","压力"],"很大。」"],["姥姥说：「那就对了，钻石都是压出来的。」"],["她还不让小姨吃第二碗饭，说男方都喜欢",["slim","苗条的"],"姑娘。小姨说：「那让他找根筷子。」"],["媒人是王姨，专门给人",["introduce","介绍"],"对象，她那张",["mouth","嘴"],"，树上的鸟都能说下来。"],["第一位，王姨说人家是",["ambassador","大使"],"，全家肃然起敬，姥爷翻出了领带。见了面才知道，是",["gym","健身房"],"发传单的，头衔是自己印的。坐下十分钟，推销了三张年卡。"],["第二位，王姨说是",["captain","船长"],"。山西哪来的海？一问，公园鸭子船，手下八只鸭子。"],["第三位真靠谱，消防队的",["captain","队长"],"。这场",["date","约会"],"姥姥亲自抓，让小姨穿上",["orange","橙色的"],"羽绒服，说喜庆。其实是方便姥爷蹲在马路对面的早点铺，举着",["telescope","望远镜"],"认人。"],["小伙子一进门，看见小姨，当场立正，九十度鞠躬：「老师好！我那篇作文还欠着您！」"],["小姨带的第一届学生。"],["姥爷在对面看见这一躬，激动地打电话：「成了成了，都拜上了！」"],["开学那天，姥姥去",["platform","站台"],"送小姨，往她包里塞了一瓶黄桃",["tin","罐头"],"，又往她手里塞了个剥好的",["orange","橙子"],"。小姨黑着脸：「妈，我的",["everything","每件事"],"你都要管吗？」"],["姥姥没接话，过了一会儿才说：「你小时候一发烧，就要吃这个。我七十六了，怕哪天你病了，没人给你开瓶盖。」"],["小姨教了十三年书，头一回答不上来。"],["火车开了，她给姥姥发了条微信：「下一场的",["date","日期"],"，您定吧。」"],["姥爷听说，连夜擦起了镜片。"]]},"10":{"title":"楼上的论剑山庄","paragraphs":[["我家住四楼。楼上张叔退休以后迷上了舞剑，花三十八块买了把木头的",["sword","剑"],"，每天早上六点准时",["upstairs","在楼上"],"跺脚。"],["咚，咚，咚。天花板的白灰往下掉，我的书桌像一片",["ruins","废墟"],"。"],["这周英语听写，单词",["spelling","拼写"],"我错了九个。老师问怎么回事，我说楼上有人练剑，她让我少看小说。"],["我爸要上去理论，我妈拦住他：「人家的爱好，你得",["respect","尊重"],"。」"],["「他这是要",["ruin","毁坏"],"我闺女的前途！」"],["当晚我爸拎了一瓶",["wine","葡萄酒"],"上楼，想让张叔",["discourage","打消念头"],"。二十分钟后他下来了，一副",["discouraged","气馁的"],"样子：「他说要开民宿。」"],["原来张叔的儿子搬走了，空出两间房。他挂到网上，提供",["accommodation","住宿"],"，再管一顿",["brunch","早午饭"],"——练完剑都十点半了，早饭午饭只能合成一顿。店名叫「论剑山庄」。"],["小区里",["widespread","普遍的"],"看法是：老张疯了。"],["我爸打开手机，开始",["search","搜寻"],"这家店，找到后打了一星，成了它第一个",["reviewer","评论者"],"：「楼下住户。每天六点地动山摇，宛如身处江湖。」"],["我觉得我就是这场江湖恩怨里最无辜的",["civilian","平民"],"。"],["谁也没想到，「宛如身处江湖」火了。太原的、平遥的武侠迷全来了，五个人一起在楼上跺脚。我家",["whichever","无论哪个"],"房间都躲不掉。有个客人带的小孩",["sucking","吸吮着"],"棒棒糖站在楼道里，看见我爸就喊：「大侠！」"],["我爸活了四十八年，头一回被人叫大侠，火没发出来。"],["直到有天早上，六点，没动静。"],["我爸准时醒了，躺着等。六点十分，他坐起来：「不对。」拖鞋穿反了就上了楼。"],["张叔闪了腰，趴在沙发边起不来。我爸把他从五楼背下去，送到医院。路上张叔说，老伴走了三年，屋里太静，不跺两脚，他总觉得这家里没人。"],["我爸一句话没说。"],["张叔出院那周，早上六点，咚，咚，咚。"],["我爸翻了个身，嘟囔一句：「行，活着呢。」接着睡了。"]]},"11":{"title":"收到","paragraphs":[["我妈手机里置顶的不是我爸，是家长群。班主任一发通知，她三秒内回「收到」，必须第一个。"],["我爸说他对这个群是",["allergic","过敏的"],"，一打开就起疹子，所以家长会从来都是我妈去。"],["每天最激烈的",["battle","战斗"],"，就发生在那三秒里。对手是李妈妈，全群最",["vain","自负的"],"家长，女儿年级前十，开口就是「人家",["the British","英国人"],"教孩子从来不这样」。"],["学校通知",["Wednesday","星期三"],"晚上开家长会。我妈举手要主持，还把名字改成「家校共育",["conference","会议"],"」。她用 Excel 做了一张",["timetable","时间表"],"，精确到分钟，又拉来楼下袜子店当",["sponsor","赞助商"],"，每位家长发一双",["socks","短袜"],"，袜口印着「共育」。"],["教室门口还挂了",["a couple of","一对"],"红灯笼。我说妈，这是家长会，不是开业。我劝了半小时，全是",["in vain","徒劳的"],"。她开始对着镜子练「各位家长晚上好」，我知道这是个",["dangerous","危险的"],"信号。"],["我被抓去门口发袜子，全程目睹。"],["李家",["couple","夫妇"],"带着 PPT 来了，标题是「我家这学期的",["harvest","收获"],"」。翻到第十一页，我妈举起手机：「李姐，超时四十秒，下一项是袜子店老板致辞。」全场第一次见有人敢打断她。"],["这时班主任忽然站起来：「先",["pause","暂停"],"一下。我要专门",["refer to","提到"],"一个同学。」我妈看了眼表格，这一项没排。"],["班主任念了我的名字：英语从五十八考到九十一，全班进步最大。"],["我妈手里的话筒抖了一下。她脸上的",["pride","自豪"],"，那张表格装不下。"],["李妈妈张了张嘴，这回没有「人家」。"],["回家路上我问她：「抢那个『收到』，到底图啥？」"],["她走了好一会儿才说：「你那些题妈不会。妈初中毕业，群里的话有时都看不懂。别的帮不上，就这两个字，能让老师记得你有个妈。」"],["我没接上话。"],["那晚她在沙发上睡着了，袜子都没脱。手机一震，她眼都没睁，摸过来按了两个字。"],["收到。"]]},"12":{"title":"我爸的三层蛋糕","paragraphs":[["我妈",["birthday","生日"],"前",["fortnight","两星期"],"，我爸开始不对劲。"],["他最恨",["shopping","购物"],"，现在下了班就往超市跑，半夜还躲在厨房看视频。一问才知道，他要亲手烤三层蛋糕，说外头的蛋糕没有灵魂。"],["问题是我爸只",["possess","拥有"],"两项厨艺：泡面和煮鸡蛋。连塌五个之后，他想出用筷子把蛋糕撑住，还说这办法能申请",["patent","专利"],"。"],["他身上开始飘出甜香。我妈闻了闻他的领子，第二天列了份",["potential","潜在的"],"嫌疑人名单。第一名，楼下烘焙店老板娘。第二名，我，因为我一看见她就想笑。"],["生日前三天，家里爆发了今年最大的一场",["quarrel","吵架"],"。"],["「你说，你每天半夜在干啥？」"],["「给你烤蛋糕」卡在",["throat","喉咙"],"里，为了惊喜，我爸硬咽回去，只憋出三个字：「没干啥。」"],["全家的官方",["language","语言"],"变成「告诉你爸」和「告诉你妈」。两人隔着一张饭桌，我来回翻译。"],["最",["extraordinary","离奇的"],"还在后头。"],["生日当天，我爸想",["speed","加速"],"，把烤箱拧到最高挡。烤箱冒了一股烟，死了。他从阳台搬出蜂窝煤炉子：「山西人啥都缺，不缺",["fuel","燃料"],"。」"],["蛋糕底是黑的，奶油一抹，看着还行。这时我妈发来消息：「人已经",["aboard","在车上"],"了，回你姥家。」"],["我爸抄起车钥匙，我抱着蛋糕坐电动车后座。那",["speed","速度"],"，小区的狗都没追上。"],["过减速带时，蛋糕腾空转了半圈，一个标准的高台",["dive","跳水"],"，扎进路边水坑。水花压得很小。"],["我爸蹲在水坑边，手里捏着几根筷子。我拍下来发给了我妈。"],["我妈下一站就下了车。晚上回来，她吃了没沾水的半层，说：「糊了。」又挖了一勺。"],["后来她告诉我，她的生日根本不是这天。二十年前我爸头一回给她过生日，就把",["month","月份"],"记错了，她没说破。"],["我问为啥不告诉他。"],["她说：「他记住一个日子多不容易，哪能让他重记。」"]]},"13":{"title":"贾老师的指南针","paragraphs":[["我们地理老师姓贾，闭着眼能画中国地图。全校都拿地理当副科",["treat","对待"],"，他忍了三十年。"],["今年全年级",["twenty","二十"],"个班去太行山研学，路线归他定。他戴着红",["cap","帽子"],"，脖子上挂着",["compass","指南针"],"，胸前别着磁吸胸牌，手里提一只旧铁皮",["case","箱子"],"，谁碰跟谁急。"],["有人说手机能导航。他冷笑：「这才是",["classical","古典的"],"定位法。」"],["进山徒步两小时，我们第三次路过这",["heap","一堆"],"",["onion","洋葱"],"。"],["班长小声说：「老师，咱们和它见过三面了。」"],["他看看太阳，说根据",["ray","光线"],"的角度，这是另一处。"],["",["worse","更坏的"],"消息是，山里没信号。年级组长脸都白了，说这是全县今年最大的失踪",["case","案件"],"：八百人，一起丢。"],["村口又冲出七只大鹅，八百人集体后退。男生把书包",["heap","堆起来"],"当",["defence","防御"],"工事，大鹅一嘴就啄开了。"],["一位大娘拎着",["basket","篮子"],"过来，一声吆喝，鹅全散了。贾老师问圪针沟怎么走，大娘说没听过。他摊开地图一指，大娘乐了：「这不就是俺们村？」"],["原来本地人根本不这么",["pronounce","发音"],"。全年级已经绕着目的地走了三圈。"],["学霸走上前，拧开指南针的",["cap","盖子"],"，把胸牌拿远。针慢慢转了大半圈。"],["真实",["case","情况"],"是，从出发到现在，那根针指的一直是他自己。"],["全年级迅速达成",["consensus","共识"],"：回去跟大娘走。"],["返程下起大雨。贾老师脱下雨衣，把铁皮箱",["protect","保护"],"起来，自己淋得透湿。上了大巴，我们问里面是啥。"],["他打开了。满满一箱明信片，漠河的，三亚的，冰岛的，三十年的学生寄来的。背面都差不多：「老师，您讲的地方我到了，是真的。」"],["有人问他这些地方去过几个。"],["他擦擦眼镜：「我妈身体不好，我没出过省。今天算走得最远的一回。」"],["我打算高考完也寄一张，就写：老师，这回我没绕路。"]]},"14":{"title":"我叔下班后去哪了","paragraphs":[["我叔在",["mine","矿山"],"上干了三十年，话少得很。我婶说，他这辈子只会",["mine","开采"],"两样东西：煤，和她的耐心。"],["下个月是他俩结婚三十",["anniversary","周年纪念日"],"，我婶却发现不对劲。矿上四点下班，走回家二十分钟，我叔天天七点才进门，手上还多了几道小口子。"],["我婶把日历拍在桌上：「一个大活人，怎么会每天",["disappear","消失"],"两个多钟头？这道",["arithmetic","算术"],"题要",["murder","谋杀"],"我的脑细胞！」"],["我叔一咳嗽，她就能",["judge","判断"],"他藏了多少私房钱。这回他不咳，她慌了。"],["周六全家开庭。堂哥家六岁的小",["niece","侄女"],"豆豆戴上老花镜当",["judge","法官"],"，擀面杖一敲：「现在",["begin","开始"],"！」"],["我叔在四百米",["deep","深的"],"井下眉头都不皱，这会儿直冒汗。"],["「爷爷去哪儿了？」"],["「加班。」"],["豆豆想了想：「判爷爷给我买冰淇淋。」"],["我婶说这法院不行，她亲自查。"],["第二天起了大",["fog","雾"],"，两步外看不见人。我婶戴上墨镜，拉着我出门，说这是她五十三年来最大的一场",["adventure","冒险"],"。"],["我叔下了班往矿后头走。他一回头，我婶就得",["pretend","假装"],"看风景。四周白茫茫一片，她还戴着墨镜。"],["矿后头有间小平房，周围",["environment","环境"],"十分可疑：窗帘拉着，门口堆着煤。屋里传来「咔、咔、咔」的",["sound","声音"],"。"],["我婶贴着门缝：「这怎么",["sound","听起来"],"不像打麻将？」她一把推开门。"],["我叔和老王师傅一人一把小刻刀，桌上十一个碎掉的黑疙瘩。我叔把第十二个藏到身后：「还没弄完……」"],["那是一个用煤雕的",["cup","杯子"],"，底下刻着「30」。煤是他掏钱找矿上买的，发票还在兜里。"],["我婶问：「能喝水不？」"],["「不能。」"],["「那要它干啥？」"],["我叔憋了半天：「……冬天能烧。」"],["到了正日子，豆豆伸手想玩，我婶一把抱走：「谁也别碰，这是",["mine","我的"],"！」"],["那宝贝她每天擦一遍。"],["她嫌了我叔三十年手洗不干净。现在，她的手也洗不干净了。"]]},"15":{"title":"我妈的科目二","paragraphs":[["我妈五十岁那年报了驾校。"],["她说坐了二十年我爸的车，听了二十年他那盘老情歌",["tape","磁带"],"，想要一点",["freedom","自由"],"。"],["我爸说他跟驾校校长有点",["ties","关系"],"，能打个招呼。我妈说：「用不着，我自己考。」"],["驾校里五十岁的学员是",["handful","少数"],"。教练姓段，比我妈小二十岁。第一节课他念了半小时驾校",["regulations","规章"],"，我妈拿小本子一条条抄，比我月考还认真。"],["她是个特别",["cautious","谨慎的"],"学员。上车先",["tie","系"],"安全带，系完再拽三下。车座是",["hard","硬的"],"，她自己缝了个棉垫子带去。"],["理论题里有块牌子，画着一只",["deer","鹿"],"。她背了一晚上，问我：「咱县哪来的这东西？」"],["倒车入库是",["hardest","最困难的"],"一关。地上的",["signs","标记"],"她总看不清，老想下车看。段教练说：「姨，考试不让下车。」"],["第三天，她把车屁股顶在了场边一棵杨树的",["trunk","树干"],"上。段教练气得直",["kick","踢"],"轮胎。"],["第二天，她揣着",["handful","一把"],"红枣去了，塞给段教练：「自家树上的，降火。」"],["驾校铁门还没开，她就从围墙的",["opening","开口"],"钻进去。别人练一小时，她",["hard","努力地"],"练三小时。小本子上",["accumulated","积累了"],"四十多条「段教练语录」，第一条是：「姨，别看我，看后视镜。」"],["考试那天，考官打着",["tie","领带"],"坐进副驾驶，我妈的",["cheeks","脸颊"],"一下就红了。出门前我问她紧张不，她说：「",["certainly","当然"],"不紧张。」说完鞋穿反了。"],["她一次就过了。"],["我爸说，她头一趟肯定开去县城看灯会",["opening","开幕"],"，好显摆。"],["那个周五放学，我照常拖着那只",["trunk","大箱子"],"去挤班车。一辆白色小车停在校门口，打着双闪。车窗摇下来，是我妈。"],["「上车。」"],["车开得比电动车还慢。我这才知道，她要的不是自由。她只是不想再看我一个人拖着箱子，在班车上站三个小时。"],["车里没放老情歌，放的是我歌单里的歌。她偷偷问我同桌要的。"]]},"16":{"title":"Tony 造型","paragraphs":[["我表哥在县城开了家理发店，叫「Tony 造型」。他要求所有人叫他 Tony，谁叫他小名「拴柱」，他就不给谁剪。"],["我舅本来想让他去",["rail","铁路"],"上班，稳当，管吃管住。表哥头一回",["disobeyed","不服从了"],"，拿攒了三年的钱租了个门面。我舅气得半年没跟他说话。"],["他的手艺是跟一张",["CD-ROM","光盘"],"学的，《三十天成为发型大师》，旧货市场五块钱买的。"],["暑假我去店里帮忙。门上贴着：",["haircut","理发"],"十五元，办卡八折。"],["在 Tony 眼里，剪刀是",["holy","神圣的"],"，谁碰一下，他都要拿酒精擦三遍。我在店里吃泡面，他指着我：「这是我的",["workplace","工作场所"],"，不是食堂。」"],["可我一掀后屋的帘子，地上卷着一套",["beddings","铺盖"],"，枕头边放着半瓶",["vinegar","醋"],"。原来他就住在店里，天天泡面里倒醋。"],["第一个客人是隔壁",["roast","烤"],"串的大叔。Tony 围着他转了三圈，",["suggested","建议了"],"他剪个韩式碎发。四十分钟后，大叔的脑袋又圆又亮，像个",["bowling","保龄球"],"。"],["大叔对着镜子沉默了很久。Tony 说：「这叫高级感。」"],["大叔说：「明天你来吃串，我也给你烤个高级感。」"],["那天下午再没人来。Tony 坐在转椅上转了四十多圈，说县城人不懂时尚。我没接话，觉得他挺",["lonely","孤独的"],"。"],["周六下午，门被推开了。我舅站在门口，",["breathless","气喘吁吁的"],"，说是路过。"],["他头顶就剩一圈头发，往椅子上一坐：「剪。」"],["Tony 一句话没说，给他围上围布，剪了四十分钟。剪下来的头发攒到一起，不够一小撮。"],["我舅照了半天镜子：「还行，挺",["handsome","英俊的"],"。」付了十五块，没办卡，走了。"],["Tony 说：「我爸头发长得快。」"],["后来我才知道，我舅每周六都来，刮风下雨都来，跟单位的人说全县就这家剪得好。"],["按理说，Tony ",["should","应该"],"给他爸免单。可他一次都没免过。他知道，我舅要的就是付这十五块钱。"]]},"17":{"title":"外教 Ben 的山西口音","paragraphs":[["学校新来了一位外教，叫 Ben，来自",["America","美国"],"。他头发卷卷的，第一天就被我们起了外号：",["lamb","小羊"],"。"],["全班都等着学纯正的美式发音。Ben 走上讲台，清了清嗓子："],["「额叫 Ben，今儿给大家上课。」"],["教室安静了五秒。这一口山西",["accent","口音"],"，比我姥爷还正宗。原来他大学室友是大同人，他的中文全是跟室友学的。"],["Ben 说，课堂上大家都是",["equal","平等的"],"，不用叫老师，叫 Ben 就行。于是我们班成了全楼最吵的班。隔壁班投诉，说这是噪音",["pollution","污染"],"。"],["年级主任把 Ben 叫去办公室",["scolded","责骂了"],"一顿。Ben 回来冲我们鞠了一躬：「请",["forgive","原谅"],"额，额们小点声。」我们小声了一节课。"],["他每天中午喝一杯",["yoghurt","酸奶"],"，往里泡馍，说这叫",["culture","文化"],"交流。"],["他去学校",["finance","财务"],"处报账，会计阿姨一听口音，以为是老乡，硬塞给他两个苹果。Ben 回来感慨，中国的",["service","服务"],"太好了，还不收小费。"],["十一月来了寒潮，操场上的水洼全",["froze","结冰了"],"。Ben 在黑板上写：冰面是",["unsafe","不安全的"],"。他说在他老家，冬天不扫自家门口的雪是违反",["law","法律"],"的，邻居摔了你得赔钱。"],["写完他出门，在操场上摔了个四脚朝天。"],["他爬起来拍拍土：「越怕啥越来啥，这就是墨菲",["law","定律"],"。」"],["感恩节那天，Ben 特别安静。他说在他老家，一只火鸡就",["equals","等于"],"一家人的团圆。今年他一个人过。"],["第二天中午，我们端着保温桶去了他宿舍：羊汤、饺子、我妈烙的饼。三十个人挤在十平米的屋里，没有火鸡。"],["外号叫小羊的 Ben 喝了一口羊汤，眼睛红了。他说小时候的愿望是一大家子人围着吃饭，没想到在山西",["realised","实现了"],"。"],["我们这才",["realised","意识到了"],"，一个人能把别人家乡的话学得这么像，大概是因为他太想家了。"]]},"18":{"title":"七个人的《醋坛子》","paragraphs":[["艺术节要出节目，班长乔安报了个话剧。她是全班最",["outgoing","外向的"],"人，在小卖部能跟老板聊二十分钟。"],["剧本是她自己写的，叫《醋坛子》：醋坊老板娘要",["dismiss","解雇"],"偷喝醋的伙计，伙计一慌，打碎了祖传的",["jar","坛子"],"……全班三十个人，人人有角色。我演",["pedestrian","行人"],"甲，台词就一句：「哎呀。」"],["排练在礼堂",["southwest","西南"],"角，",["atmosphere","气氛"],"好得不像在高二。"],["然后",["flu","流感"],"来了。"],["周一，演老板娘的女生发烧请假。周二，另外两个",["actresses","女演员"],"也倒了。周三，男主角在台上打了个喷嚏，第二天他同桌也没来。"],["班主任每节课都开窗，说要让",["fresh","新鲜的"],"空气进来。我们裹着羽绒服上课。"],["到了周五，班里只剩七个人。乔安站在讲台上，嗓子都哑了：「戏照演。」"],["她连夜改剧本。人不够，就让东西来演：体委套着纸箱演醋缸，物理课代表披着蓝床单演",["atmosphere","大气"],"，全程在台上飘。我一个人演行人甲乙丙，换顶帽子就是另一个人。"],["我说这是我听过最",["unfair","不公平的"],"安排。乔安说：「你最健康。」"],["演出那天，主持人说：「各位",["ladies","女士"],"们、先生们……」大幕拉开，台下安静了三分钟，没人看懂。"],["然后怪事",["occurred","发生了"],"：评委开始记笔记。"],["演完，评委说这是一部",["abstract","抽象的"],"作品，问：「那个披蓝床单的，代表什么？」"],["乔安是个",["honest","诚实的"],"人：「代表我们班唯一没请假的男生。」"],["全场笑了，然后开始鼓掌。我们拿了最佳创意奖。别的班说这是",["sympathy","同情"],"分，我们也认。"],["散场时，乔安宣布",["dismiss","解散"],"，话刚说完，就蹲在地上哭了。我扶她起来，手一碰，烫的。她已经烧了两天，一直没说。"],["第二天她也请假了。病好的同学一个个回来，只空着她的座位。"],["奖状背面签了三十个名字，贴在后墙上。演老板娘的女生在最底下写了一行：「下回，咱们三十个人一起演。」"]]},"19":{"title":"我姑的停电账本","paragraphs":[["元旦",["holiday","假期"],"，全家照例聚到我姑家。我姑在县水泥厂当了二十六年",["accountant","会计"],"，家里一包瓜子都按人头分。"],["那是个",["foggy","多雾的"],"晚上，七点刚过，屋里的灯「啪」一下全灭了。"],["电暖气停了。大家把",["overcoat","大衣"],"又穿回身上，在客厅地上铺了几块",["mat","垫子"],"，围着一根蜡烛坐。"],["表弟的手机只剩百分之三的电。他双手合十，对着屏幕做最后的",["prayer","祈祷"],"：「撑住，这把排位马上赢了。」"],["屏幕黑了。他仰天长叹：「没有",["electricity","电"],"，",["mankind","人类"],"还怎么活？」"],["我姑头都没抬：「你老祖宗没电活了几千年。」"],["姑父是个",["easy-going","随和的"],"人，在黑地里精准摸到了瓜子盘。我姑扫了一眼：「看看，一屋子",["corrupt","腐败的"],"人，全让瓜子和手机泡坏了。」"],["她",["immediately","立即"],"开始分配",["labour","劳动"],"：姑父烧水，我和面，表弟剥蒜。电水壶用不了，她从柜顶翻出一把落了灰的铁",["teapot","茶壶"],"，坐在煤气灶上。"],["表弟剥到一半，跟我抢最后一个充电宝，差点打起来。我姑一手拎一个，把我俩",["separate","分开"],"：「你擀皮，你包。」"],["饺子包了九十个，蜡烛换了三根。我爸讲了他小时候偷 侯老师抱着一摞",["thick","厚的"],"卷子进来，嗓子哑得像砂纸。医生让他做",["treatment","治疗"],"，他说周六有课，没空。"],["我们班",["recent","最近的"],"一次月考，数学年级倒数第一。"],["「学校搞『最美周末课堂』评比，每个班拍一段视频。」他清清嗓子，「我亲自",["direct","导演"],"。」"],["教室门的",["handle","把手"],"上周掉了，一直没修。侯老师把它攥在手里当喇叭：「镜头一，同学们热爱数学。开始！」"],["黑板上写着题：一群",["sheep","绵羊"],"和鸡关在一起，共三十个头，九十条腿。"],["「我讲完，你们一起",["nod","点头"],"，要真诚。」"],["拍到第六条，后排男生的科幻小说入了镜，封面上",["federal","联邦的"],"舰队正在打外星人。侯老师没收了，翻两页，揣进兜里。"],["拍到第十二条，班长举手：「老师，我",["on behalf of","代表"],"全班说一句，我们的腿像灌了",["lead","铅"],"。」"],["侯老师掏出一袋",["acid","酸的"],"杏干，一人一把：「醒醒。」"],["全班酸得五官乱飞，表情前所未有地真诚。"],["鸡和羊那道题，还是有人不会。侯老师说有个",["direct","直接的"],"办法：「让所有的羊抬起两条前腿。」说完他自己先举起了两只手。"],["这一条，过了。"],["最后一个镜头，他要",["lead","带领"],"全班去校门口的",["square","广场"],"，现场量面积。答案必须带",["square","平方的"],"单位，谁只写「米」，扣两分。"],["「为啥非得拍这么好？」我们问。"],["「",["possibly","也许"],"校长爱看吧。」他说。"],["视频拿了一等奖。校长说奖品不好定，侯老师说：「我来",["handle","处理"],"。」"],["奖品是：全班免一个周六的补课。"],["那个周六，班长在医院走廊碰见了侯老师。他排队等雾化，手里的书套着数学家",["biography","传记"],"的书皮，里面是没收的那本科幻小说。"],["他哑着嗓子，指了指挂号单，又指了指班长：「一周就这一个周六。你们得歇，我也得歇。」"]]},"28":{"title":"五楼的常住人口","paragraphs":[["我们学校图书馆在实验楼五层，没电梯。常住",["population","人口"],"只有两个：",["librarian","图书管理员"],"冯阿姨，和一只来路不明的猫。"],["冯阿姨最恨两种人：在书上画线的，和来蹭空调睡觉的。后一种占九成。"],["为了拉人，她开始在家",["bake","烘烤"],"小饼干，门口贴了告示：借书送饼干。"],["第一天来了四十个人，饼干全没了，书一本没借出去。有个男生拿了三块，顺手翻开一本《猫咪",["republic","共和国"],"》，里面爬出一条",["worm","虫子"],"。他尖叫一声，",["surrounding","周围的"],"同学全被吵醒了。"],["冯阿姨说：「这虫子都比你们爱读书。」"],["期末前学校通知：图书馆改自习室，旧书按斤卖废品。"],["冯阿姨去找校长，说要",["rescue","营救"],"这些书，损失她来",["undertake","承担"],"。校长说，书已经拉走了。"],["她追到废品站，坐在小板凳上跟大爷",["bargain","讨价还价"],"：「这本讲",["dam","水坝"],"的，图多，按斤算不合适。」「这本讲",["Egypt","埃及"],"的，你看这金字塔，跟新的一样。」"],["大爷磨不过她，一块钱一本，全是",["bargains","便宜货"],"。"],["她雇三轮把书拉回学校，一抬头愣住了。"],["四十个人从楼下排到五楼，一本一本往上传书。被虫子吓得尖叫的那个男生，站在最上面。"],["原来高三学姐早在群里喊了：文综",["political","政治的"],"那几道大题，全靠那本旧辅导书。"],["书搬完，冯阿姨做了一次",["random","随机的"],"抽查，看有没有人画线。她翻到一本旧外国小说，讲一个年轻的",["Christian","基督徒"],"去远方当医生，书里全是铅笔线。"],["借书卡上第一个名字，是她自己，日期是三十年前。"],["",["afterwards","后来"],"我们才知道，她就是这所学校毕业的。家里买不起书，她每天在这间屋子里待到天黑。"],["「画线不对。」她把书插回架子，「可那会儿，舍不得还。」"],["图书馆还是改了自习室，但留下一整面墙的书。"],["现在这里的常住人口，是四十一个人，加一只猫。"]]},"29":{"title":"秦老师的红旗","paragraphs":[["我们班主任秦老师带了我们一年半，门框上一次流动红旗都没挂过。"],["隔壁三班挂了三个月。三班班主任和秦老师同年分来，教同一科，走的是两条",["parallel","相似的"],"路，区别只在那面红旗。她每天路过我们门口，都故意放慢脚步。"],["周一班会，秦老师宣布，这个月搞一场卫生大",["revolution","革命"],"。「红旗是一个班的",["honour","荣誉"],"，也是我的脸。」"],["她给每人划了",["duty","责任"],"区。我管黑板，黑板槽的",["edge","边缘"],"要擦三遍。"],["第二天早上六",["o'clock","点钟"],"，她已经站在门口了，手里拿着一把米尺。"],["她用粉笔在地上画了几条",["parallel","平行的"],"线，桌腿必须压线。有张桌子出现了",["slight","轻微的"],"倾斜，她蹲下去看了半天，像眼科",["specialist","专科医生"],"在看病人。"],["水杯放在桌角同一个",["position","位置"],"。窗帘的褶子要像",["waves","波浪"],"一样一道一道。原来窗帘的",["pattern","图案"],"是小碎花，她嫌乱，自费换了块素色的：「这才是",["pretty","漂亮的"],"窗帘。」"],["「教室门口那条",["access","通道"],"必须空着，检查组进门第一眼看的就是这儿。」于是门口的扫把、拖把、簸箕，全",["squeezed","被挤"],"进后面的柜子。柜门关不上，体委拿肩膀顶了五分钟才锁住。"],["检查那天，组长刚走到后排，柜门砰地弹开，扫把哗啦啦拍在他脚边。"],["扣三分。红旗又去了三班。"],["秦老师还得笑着跟他们",["wave","挥手"],"，送他们出门，脸比新窗帘还白。"],["晚上她在班级群发了一大段话。十秒后，她",["withdrew","撤回了"],"，只剩一行灰字。"],["第二天全班提前一小时到校。桌子压好线，扫把用麻绳捆好。讲台上插着一面红纸剪的小旗，体委写的字，歪歪扭扭：「秦老师专属，不流动。」"],["她站在门口看了很久，没说话，伸手把小旗扶正了。"],["我们不是怕她才干的。是真的",["honour","尊敬"],"她。"]]},"30":{"title":"班长赔烧杯","paragraphs":[["我们班",["monitor","班长"],"韩冬，是那种借块橡皮都要打欠条的人。他爸是",["lawyer","律师"],"，所以他从小说话就带条款。"],["化学实验",["lab","实验室"],"在教学楼最",["west","西边"],"，一年也去不了几次。第一节实验课，老师说每人交十块钱",["deposit","押金"],"，打碎器材从里面扣。"],["韩冬当场宣布：「押金由班长统一",["deposit","存放"],"。」他收齐四十八份，装进信封，锁进讲台的",["drawer","抽屉"],"，钥匙挂在脖子上。"],["那天做的是酒精灯加热。老师刚交代完就被叫去开会，临走指了指墙角的",["monitor","监视器"],"：「都看着呢啊。」"],["韩冬的",["expression","表情"],"立刻严肃起来。他走上讲台：「老师不在，我就是这屋的……」他想了半天，没找到合适的",["expression","表达"],"，最后说：「法人。」"],["十分钟后，法人亲手把一只烧杯碰到了地上。"],["啪的一声，全班像一群",["wolves","狼"],"一样围了过来。韩冬去捡碎片，手指被烫了一下，眼看着开始",["swell","肿"],"。"],["胖子压低声音：「班长，那个角落监控拍不着。扫了就完事。」"],["韩冬站在那儿，内心",["struggled","挣扎了"],"整整一分钟。"],["然后他做了一个",["brave","勇敢的"],"决定。他从",["schoolbag","书包"],"里掏出钱包，数出十块，塞进信封，又在信封背面写：「烧杯一只，韩冬个人赔付，与集体无关。」"],["眼看实验就要",["conclude","结束"],"，老师回来了。韩冬举着那根手指，像去自首。"],["老师听完，笑了：「那个监视器坏了三年了。屏幕一直放屏保，一张",["beach","海滩"],"的照片。」"],["全班安静了两秒，然后爆笑。胖子拍着他的肩：「白掏十块。」"],["韩冬推了推眼镜：「监控坏了，我又没坏。」"],["老师把十块钱退给他，说：「我很",["appreciate","欣赏"],"你这样的人。」"],["后来那张信封贴在了实验室门上。每次有人打碎东西，都会自己走到老师面前说一声。"],["全班都很",["appreciate","感激"],"韩冬。因为从那以后，化学老师说，咱班不用交押金了。"]]},"31":{"title":"我爸的狗","paragraphs":[["我和我弟想养狗，想了三年。我爸的态度三年如一日：不行。"],["我爸是县医院的",["surgeon","外科医生"],"，洗一次手要洗",["quarter","一刻钟"],"。在他眼里，狗和细菌要",["alike","同样地"],"对待：离远点。"],["今年暑假，我弟想出一个",["clever","聪明的"],"办法：搞一场正式答辩。我写稿，他做PPT，目标只有一个，",["persuade","说服"],"我爸。"],["我弟穿上小学毕业时的西装，整件都是",["tight","紧的"],"，扣子绷得随时要弹出去。"],["第一页：「养狗是人类的古老",["custom","习俗"],"。」"],["我爸：「放鞭炮也是，你放？」"],["第二页：「狗能陪伴",["teenagers","青少年"],"健康成长。」配图是我俩的合影，P了一只金毛，比我弟还大。"],["第三页是承诺书：每天遛狗两次，过",["zebra-crossing","斑马线"],"一定牵绳。我月考进年级前一百，就当给我的",["reward","奖励"],"。"],["PPT才讲到",["quarter","四分之一"],"，我妈已经在旁边",["tasting","品尝着"],"我弟炒的西红柿鸡蛋，这是他的贿赂。我妈嚼了两口：「",["taste","味道"],"还行。我",["approve","赞成"],"。」"],["二比一。我觉得这是个好的",["beginning","开端"],"。"],["我爸",["admitted","承认了"],"PPT做得挺好，然后说：「我没",["approve","批准"],"，不算数。」"],["答辩失败。"],["三天后，我弟借我爸手机打游戏，冲进我屋把手机塞给我。"],["搜索记录一屏一屏往下滑：「小狗打什么疫苗」「柴犬掉毛严重吗」「狗一般能活几年」。"],["最后一条是：「狗走了以后，小孩多久能缓过来」。"],["那天晚上我爸才说，他十五岁那年在老家养过一条大黄狗。他去县城住校，一学期后回家，狗已经没了，最后一面都没见上。"],["「狗",["indeed","确实"],"好，」他说，「就是走得太早。我不想你俩也哭那么一回。」"],["我弟想了想：「那我们陪它到那一天。」"],["我爸没说话。"],["下个周末，他从同事家抱回一只小黄狗，起名二黄，还立了条规矩：狗不会",["admitted","被准许进入"],"他的书房。"],["第三天夜里，我看见书房门开着一条缝。二黄睡在我爸的拖鞋上，我爸坐在旁边，一下一下给它顺毛。"]]},"32":{"title":"两本日记","paragraphs":[["我",["seventeen","十七"],"岁那年，我妈有了一个重大",["discovery","发现"],"：我的",["diary","日记"],"本。"],["它藏在床垫底下，带密码锁，密码是我生日。我妈后来说，这是对她智商的侮辱。"],["手机、平板，所有",["digital","数码的"],"东西她都能解锁，所以我才用纸写。没想到纸也守不住。"],["那天晚上我在",["bath","浴室"],"里",["bath","洗澡"],"，水声哗哗的，没听见她进我屋。"],["本子里写的是我们班一个男生。他是学校",["rugby","橄榄球"],"队的，全队一共六个人。他有一张",["oval","椭圆形的"],"脸，像个鸭蛋。我写：「今天他在班会上做",["presentation","演示"],"，PPT放反了，还是",["much","非常"],"好看。」"],["上个月我拉我妈去",["temple","庙"],"里烧香，说是求月考。现在她知道我求的是什么了。"],["我出来的时候，日记本端端正正摆在枕头上。"],["翻开一看，她拿红笔",["circled","圈出了"],"十一个错别字。「憧憬」的「憬」我写成了「景」，她在旁边批：「竖心旁。你憧憬的是风景？」"],["写他的那几页，页边画了一个大",["circle","圆圈"],"，旁边三个字：这是谁？"],["那一周我",["headache","头疼"],"得睡不着。我的屋成了景区，我妈是每天来三趟的",["visitor","参观者"],"，进来看一眼，出去，什么也不说。"],["周六，她从衣柜顶上搬下一个铁盒子，扔给我一本褪色的硬皮本。"],["「看吧，扯平了。」"],["是她十七岁的日记。",["much","许多"],"页写的都是同一个男生：「他今天又没",["shave","刮胡子"],"，邋遢死了。」「他打篮球摔了，活该。」「他说毕业要娶我，我才不信。」"],["她说我那几页是她读过",["sourest","最酸的"],"东西。我说她这几页也不遑多让。"],["本子里夹着一张发黄的照片。照片上那个邋遢男生，是我爸。"],["我扭头看阳台，我爸正在浇花，胡子还是没刮。"],["晚上我又翻开自己的日记，最后一页多了一行红字："],["「妈十七岁的时候，也最怕有人翻日记。对不起。错字改了，别的妈没看见。」"],["第二天我换了密码。换成了她的生日。"]]},"33":{"title":"有蛋壳的鸡蛋饼","paragraphs":[["我同桌苏苗苗，这学期多了一个",["step-mother","继母"],"。"],["她爸再婚，新阿姨姓罗，在超市当收银组长。苗苗不叫妈也不叫姨，统一称呼「那位」。"],["罗姨想对她好，方法全是网上搜的。"],["听说苗苗爱吃鸡蛋饼，她五点起床，守在",["stove","炉子"],"前面摊。端上桌的是面糊、葱花和蛋壳的",["mixture","混合物"],"，咬一口，咯嘣一声。罗姨紧张地问：「是蛋壳吗？我挑了半小时。」"],["她托表妹从",["Hong Kong","香港"],"带回来一个手机壳，",["metal","金属"],"边框，镶满水钻，",["surface","表面"],"亮得能照出人影。苗苗揣着它来上学，我说你兜里像装了个吊灯。"],["后来罗姨看到「陪孩子打游戏能拉近距离」，给苗苗装了一款",["computer game","电子游戏"],"。结果自己上瘾了，每晚登苗苗的号冲排名。苗苗说这是",["abuse","滥用"],"继母职权。"],["罗姨打进了全区前十，截图发到家庭群：「这是咱们家的",["glory","荣耀"],"！」"],["苗苗回了一句：「你又不是我妈。」"],["群里安静了一晚上。那句话对罗姨的",["wound","伤害"],"有多大，第二天的早饭就知道了：一袋超市面包。"],["罗姨去请教她的",["superior","上司"],"，超市店长，家里也有个高中生。店长给了一个",["superior","更胜一筹的"],"方案：少说话，多做事。"],["于是苗苗床头多了一双新球鞋，没留纸条。鞋小了半码，把她的",["heel","脚后跟"],"磨破了。她天天穿。"],["我很",["wonder","想知道"],"她到底嫌不嫌弃。"],["周一她左手背贴着创可贴来上学，底下是个烫出来的小",["wound","伤口"],"。"],["「周日是那位的生日，」她说，「我五点起来摊鸡蛋饼，才知道蛋壳是真挑不干净。」"],["那张饼糊了一半。罗姨全吃了，说：「有蛋壳，对味儿。」"],["后来游戏出了新",["version","版本"],"，能绑定家人。苗苗给罗姨注册了个新号，绑上了，备注是「罗妈」。"],["从那天起，冲排名对罗姨没了",["attraction","吸引力"],"。她每天登上号，就盯着那两个字看。"],["在苗苗家，这算一个",["wonder","奇迹"],"。"]]},"34":{"title":"最金贵的一车货","paragraphs":[["暑假我舅拉货去广东，问我去不去。"],["我",["mother","母亲"],"第一个跳出来",["oppose","反对"],"：「那是受罪，不是旅游。」舅拍胸脯说他跑车二十年，",["credit","信用"],"在物流园响当当。我妈才松口，往我包里塞了一",["packet","小包"],"晕车药。"],["舅的",["lorry","卡车"],"是十三米的半挂。驾驶室归他",["rule","统治"],"，他定了三条",["rules","规则"],"：不许脱鞋，不许外放短视频，不许问「还有多远」。"],["仪表台上的塑料盒，是他专门用来",["keep","饲养"],"乌龟的。乌龟叫「稳稳」。他说开大车最要紧的是",["keep","保持"],"一个「稳」字。"],["第一天挺新鲜。我掏出历史作业",["review","复习"],"，世界史讲到美洲：",["Mexico","墨西哥"],"的玉米，种植园的",["slavery","奴隶制度"],"。舅瞄了一眼：「墨西哥的辣椒，跟咱的老陈醋一个地位。」"],["第二天，窗外的山长得都一样。我问了三次「还有多远」，被罚给稳稳换水。"],["舅开车的时候要",["keep","一直"],"",["chewing","嚼着"],"口香糖，说这是他提神的",["means","手段"],"，不伤胃。「开大车的，胃是第一个出毛病的",["organ","器官"],"。」"],["第三天卸货，定位在山沟里，导航上标着「大型车辆不",["accessible","可到达的"],"区域」。舅下车用脚量了量路宽，倒车，一把进去。"],["货主看呆了，在平台上给他写了",["review","评论"],"：「师傅技术过硬。就是带的孩子话太多。」"],["舅笑了一路。"],["返程半夜，我被熏醒了。车里飘着一股",["smelly","臭的"],"、发酸的、有点熟悉的味道。"],["我以为舅破了第一条规矩。"],["打开顶灯，他鞋穿得好好的，正把一个塑料袋往窗外挂。里面是我的球鞋，第一天就被我脱了塞在座位底下，捂了三天。"],["他只说：「睡你的。」然后开着窗，又开了六百公里。"],["到家我妈问：「你舅凶不凶？」"],["我想了想。三条规矩，破了的那条是我。"],["舅在沙发上开始",["review","回顾"],"这一趟：「油钱、过路费都不算啥。这趟拉的货，最金贵。」"],["他看了我一眼。稳稳在盒子里，慢慢翻了个身。"]]},"35":{"title":"六比一","paragraphs":[["六月底，夜里三十度。熄灯十分钟后，一只",["mosquito","蚊子"],"进了我们宿舍。"],["「嗡——」它先在我耳朵",["near","附近"],"绕了一圈，然后六张床挨个拜访，雨露均沾。"],["宿舍长宋瑶一拍床板坐起来：「谁没把窗户",["shut","关上"],"？」"],["没人承认。"],["生物课代表牛小雨打开手电，张口就是一串",["terms","术语"],"：口器、吸血、产卵期。最后得出结论：招不招蚊子跟血型",["relate","有关"],"，O型最招。我们宿舍六个人，五个O型。"],["学校对宿舍电器有",["restrictions","限制"],"，电蚊拍不让带，宿管阿姨说蚊香是",["poisonous","有毒的"],"，一律没收。学校每年发的夏季",["welfare","福利"],"是一顶蚊帐，六顶全在柜子顶上落灰。手里只剩一瓶风油精，平时考前用来",["refresh","提神"],"，现在用来止痒。"],["战争进入第二",["stage","阶段"],"。"],["学习委员程诺连夜起草《灭蚊公约》，最狠的一项",["term","条款"],"：查出开窗的人，罚她倒一周垃圾。"],["韩露露是班里出了名的",["social","社交的"],"达人，她说蚊子怕吵，用手机外放",["pop","流行的"],"歌，还跟着唱。蚊子没走，隔壁宿舍被她",["loud","大声的"],"歌声吵醒，开始敲墙。"],["体育委员白杨被叮了七个包，每个都用指甲掐了个",["cross","十字"],"，成了全宿舍最",["cross","易怒的"],"人，谁说话她都想咬。"],["凌晨一点，蚊子落在白墙上。宋瑶踩上桌子，像站上了",["stage","舞台"],"，五个人屏住呼吸。"],["啪。"],["墙上一个小红点。宋瑶看着手掌：「是我的血。」"],["牛小雨说，这就是",["social","社会的"],"毒打。六个人笑得床都在抖。"],["笑完，程诺说她得",["refresh","提醒"],"大家一句：公约还没执行完，开窗的到底是谁？"],["宿舍安静了很久。"],["「是我。」宋瑶小声说，「晚上太热了，我想让大家凉快点。」"],["蚊子就是",["cross","穿过"],"纱窗上那个破洞进来的。"],["第二天一早，宋瑶去宿管那儿",["apply","申请"],"换纱窗。垃圾我们五个人分了，一人一天。"],["下学期升高三，学校要重新分宿舍。这是我们六个人住在一起的最后一个",["term","学期"],"。"]]},"36":{"title":"九点钟查岗","paragraphs":[["我妈在浙江一家食品厂上班，是",["agency","中介"],"介绍去的。我们",["apart","相隔"],"一千二百公里，靠每晚九点的视频联系。我姥姥到现在还管它叫「",["videophone","可视电话"],"」。"],["视频的主要内容是查岗。"],["她让我把镜头对准冰箱，然后把画面",["enlarge","放大"],"，一格一格看有没有剩菜。她能隔着屏幕",["catch","抓住"],"我藏在袖子里的手机。"],["「再玩，」她",["frighten","吓唬"],"我，「我就辞职回家盯着你。」"],["她自己永远蹲在宿舍",["passage","走廊"],"里，说屋里五个人要睡觉。走廊灯是声控的，她说一会儿就得跺一下脚。"],["有时候她让我念英语课文里的一个",["passage","段落"],"。她一个词也听不懂，但听得",["absorbed","全神贯注"],"，念完还点评：「比昨天流利。」"],["她走的时候，",["suitcase","行李箱"],"里装了一袋咱家院子里的",["soil","土壤"],"，说要在宿舍窗台上种葱。每晚视频的最后五分钟，是葱的长势汇报。"],["「南方的土太黏，葱根",["absorb","吸收"],"不了水。还得是咱家的土。」"],["她说那边一切都好，跟家里没什么",["different","不同的"],"。厂里有",["regular","定期的"],"体检，伙食也好，天天红烧肉。"],["全家都信了，我",["apart","除外"],"。"],["有一回视频，她正在吃饭。我凑近屏幕一看，饭盒里是",["slice","一片"],"面包，就着一袋榨菜。"],["她发现我在看，赶紧",["swallow","咽下"],"去：「红烧肉刚吃完，这是夜宵。」"],["我没拆穿。我只是每晚都提醒她，南方潮，别",["catch","染上"],"感冒。她每晚都说，视频太",["consume","消耗"],"流量了，挂了吧。"],["国庆前一晚，九点，视频没打过来。"],["九点半也没有。我给她打电话，没人接。"],["十点，家门响了。她拖着箱子站在门口，头发被风吹得乱七八糟。为了",["catch","赶上"],"最后一班大巴，她是跑着去的车站。"],["「放了七天假，」她说，「没来得及告诉你。」"],["进门第一件事，她打开冰箱，一格一格地看。"],["这次不用放大了。"],["然后她从箱子里抱出那盆葱，细得像头发。"],["「带回来，晒晒咱家的太阳。」"]]},"37":{"title":"小姨的美容店","paragraphs":[["我小姨在太原的美容院干了十年，上过美容院",["administration","管理"],"课。今年她回县城开了家「丽姿美容」，在家族群里宣布：「从今天起，我是",["businessman","商人"],"了。」"],["开业前一晚，她把全家叫到店里挨个分任务，跟开",["parent","家长"],"会似的。我妈发传单，我当托。"],["店不大，一张粉色",["sofa","沙发"],"，一盆老家挖来的发财树，连",["root","根"],"带土，门口还立着石膏维纳斯",["statue","雕像"],"。姥姥说：「这闺女胳膊都没了，不吉利。」第二天，维纳斯穿上了姥姥织的毛衣。"],["主打产品是冰川面膜，号称取自",["the Arctic Ocean","北冰洋"],"。我问那么远的水咋运到县城，小姨说：「你不懂，这叫",["Asia","亚洲"],"供应链。」"],["她把手机",["communication","通讯"],"录里的人全拉进了顾客",["communication","交流"],"群，四百多人，一半是亲戚。我姥爷每天在里面发荷花。"],["开业当天放《好日子》，十分钟后商场",["administration","行政部门"],"的人就来了：不许放音箱。小姨很",["warm","热情的"],"，塞过去一张体验卡，人家收了卡，音箱照样搬走。"],["接着营业执照找不着了。小姨翻遍抽屉：「明明放",["somewhere","在某处"],"了！」最后在维纳斯的毛衣兜里找到。"],["一上午只来了一个顾客，就是我。小姨照样是全场最",["energetic","精力充沛的"],"人，给我做了三遍",["facial","面部的"],"按摩，我脸都被按薄了。"],["下午两点，门口忽然涌进来一群大妈，手里都捏着会员卡。"],["「你妈给的呀。她在公园逢人就说闺女开店了，二十张卡五折",["sale","出售"],"，她全包了。」"],["那一",["instant","瞬间"],"，小姨愣住了。"],["晚上关了门，小姨给姥姥做了这辈子第一次脸，盖了条",["warm","暖和的"],"毯子。姥姥脸上全是老口子，年轻时冬天下地冻的。小姨说她学美容的",["root","根源"],"就在这儿：小时候姥姥脸冻裂了，连雪花膏都舍不得买。"],["姥姥闭着眼：「手法还行。就是这冰川水，一股冰箱味儿。」"],["那二十张卡，是她卖了两年鸡蛋攒的。"]]},"38":{"title":"一只猫的排班表","paragraphs":[["",["March","三月"],"的一个晚上，我在小区门口的",["laundry","洗衣店"],"发现了一只橘猫。它趴在一 const UPDATE_LOG = [{"date":"2026-11-04","items":["网站上线：可以看 Day 1-14 的单词和故事"]},{"date":"2026-11-04","items":["加了使用指南，右上角可以随时再看"]},{"date":"2026-11-04","items":["页面改版：打开先看今天的任务和进度","点日历上的日期会自动滑到单词详情"]},{"date":"2026-11-21","items":["加了 Day 15-28 的单词和故事"]},{"date":"2026-11-21","items":["加了 Day 29-42 的单词和故事"]}];      // 更新记录，旧的在前，只往后加
const REST_WEEKDAYS = [3];  // 休息日，周日=0

const STORAGE_KEY = "gaokao_calendar_skips_v1";
const SEEN_LOG_KEY = "gaokao_calendar_seen_log_v1";  // 这个浏览器看过几条更新记录
const $ = (id) => document.getElementById(id);

const pad = (n) => String(n).padStart(2, "0");
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const dateToText = (date) => iso(date.getFullYear(), date.getMonth() + 1, date.getDate());
const textToDate = (text) => new Date(text + "T00:00:00");
const monthIndex = (dateText) => Number(dateText.slice(0, 4)) * 12 + Number(dateText.slice(5, 7)) - 1;
const shortDate = (text) => `${Number(text.slice(5, 7))}月${Number(text.slice(8, 10))}日`;

// 词表里的文字原样显示，不当成网页代码
const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const START = DAYS[0].date;
const TASKS = DAYS.filter((day) => !day.rest);  // 所有学习任务，顺序固定，顺延只改它们落在哪天
const today = dateToText(new Date());

// ---------- 顺延记录 ----------
// 只存“哪几天被顺延了”，日历每次都按这份记录重新排一遍。按点击顺序存，撤销时去掉最后一个

let storageWorks = true;

function loadSkips() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (error) {
    storageWorks = false;
    return [];
  }
  if (!Array.isArray(saved)) return [];
  // 改过开始日期或休息日之后，旧记录可能落在无效的日子上，这里滤掉
  const valid = saved.filter((text) => /^\d{4}-\d{2}-\d{2}$/.test(text) && text >= START
    && !REST_WEEKDAYS.includes(textToDate(text).getDay()));
  return [...new Set(valid)];
}

function saveSkips() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(skips));
    storageWorks = true;
  } catch (error) {
    storageWorks = false;
  }
}

// 从开始日期逐天往后走：休息日和顺延日空着，其余日子依次放任务
function buildSchedule() {
  const skipped = new Set(skips);
  const result = [];
  const cursor = textToDate(START);
  let next = 0;
  while (next < TASKS.length) {
    const date = dateToText(cursor);
    if (REST_WEEKDAYS.includes(cursor.getDay())) result.push({ date, rest: true });
    else if (skipped.has(date)) result.push({ date, skipped: true });
    else result.push({ ...TASKS[next++], date });
    cursor.setDate(cursor.getDate() + 1);
  }
  return result;
}

let skips = loadSkips();
let schedule, byDate, first, last, firstMonth, lastMonth;

function refreshSchedule() {
  schedule = buildSchedule();
  byDate = new Map(schedule.map((day) => [day.date, day]));
  first = schedule[0].date;
  last = schedule[schedule.length - 1].date;
  firstMonth = monthIndex(first);
  lastMonth = monthIndex(last);
}

refreshSchedule();

// 今天在计划范围内就显示今天，否则从第一天开始
let selected = byDate.has(today) ? today : first;
let shown = monthIndex(selected);

// ---------- 页面渲染 ----------

function renderCell(day, dateText, dayNumber) {
  const classes = ["cell"];
  if (day.rest) classes.push("rest");
  if (day.skipped) classes.push("skipped");
  if (dateText === selected) classes.push("selected");
  if (dateText === today) classes.push("today");
  let body = "";
  if (day.rest) {
    body = '<span class="note">休息</span>';
  } else if (day.skipped) {
    body = '<span class="note">顺延</span>';
  } else {
    if (day.new) body += `<span class="cell-unit">Unit ${day.new}</span>`;
    body += `<span class="count">${day.total}<small>词</small></span>`;
  }
  return `<button class="${classes.join(" ")}" data-date="${dateText}"><span class="date">${dayNumber}</span>${body}</button>`;
}

function renderMonth() {
  const year = Math.floor(shown / 12);
  const month = shown % 12 + 1;
  $("month").textContent = `${year} 年 ${month} 月`;
  $("prev").disabled = shown <= firstMonth;
  $("next").disabled = shown >= lastMonth;

  const blanks = (new Date(year, month - 1, 1).getDay() + 6) % 7;  // 周一排第一列
  const count = new Date(year, month, 0).getDate();
  const cells = Array(blanks).fill('<div class="cell blank"></div>');
  for (let d = 1; d <= count; d++) {
    const dateText = iso(year, month, d);
    const day = byDate.get(dateText);
    cells.push(day ? renderCell(day, dateText, d) : `<div class="cell blank"><span class="date">${d}</span></div>`);
  }
  $("grid").innerHTML = cells.join("");
}

function wordList(unit) {
  const rows = UNITS[unit - 1].map(([word, ipa, definition]) =>
    `<li><span class="w">${esc(word)}</span><span class="ipa">${esc(ipa)}</span><span class="def">${esc(definition)}</span></li>`);
  return `<ul class="words">${rows.join("")}</ul>`;
}

// 故事里的空已经填好：答案带下划线，后面跟中文提示
function storyHtml(unit) {
  const story = STORIES[unit];
  if (!story) return "";
  const paragraphs = story.paragraphs.map((parts) => "<p>" + parts.map((part) => (Array.isArray(part)
    ? `<span class="filled">${esc(part[0])}</span><span class="hint">（${esc(part[1])}）</span>`
    : esc(part))).join("") + "</p>");
  return `<details class="story" open><summary>故事：${esc(story.title)}</summary><div class="story-body">${paragraphs.join("")}</div></details>`;
}

function renderDetail() {
  const day = byDate.get(selected);
  const weekday = "日一二三四五六"[textToDate(selected).getDay()];
  const kicker = `<p class="kicker">${shortDate(selected)} 周${weekday}</p>`;
  if (day.rest) {
    $("detail").innerHTML = `${kicker}<h2>休息日</h2><p>这天没有任务。</p>`;
    return;
  }
  if (day.skipped) {
    // 找顺延后的下一个任务日，显示这天的内容去了哪里
    const moved = schedule.find((item) => item.date > selected && item.studyDay);
    $("detail").innerHTML = `${kicker}<h2>已顺延</h2><p>这天的任务移到 ${shortDate(moved.date)}。</p>`;
    return;
  }
  const newCount = day.new ? UNITS[day.new - 1].length : 0;
  let html = `${kicker}<h2>Day ${day.studyDay}</h2>` +
    `<p class="summary-line">新词 ${newCount} 个，旧词 ${day.total - newCount} 个，共 ${day.total} 个</p>`;
  if (day.new) html += `<h3>新词：Unit ${day.new}</h3>${wordList(day.new)}${storyHtml(day.new)}`;
  if (day.reviews.length) {
    html += "<h3>旧词</h3>";
    html += day.reviews.map((unit) =>
      `<details><summary>Unit ${unit}（${UNITS[unit - 1].length} 词）</summary>${wordList(unit)}</details>`).join("");
  }
  $("detail").innerHTML = html;
}

// 今天卡片：显示今天的任务和全程进度
function renderHero() {
  const total = TASKS.length;
  const passed = schedule.filter((day) => day.studyDay && day.date < today).length;
  const day = byDate.get(today);
  const summaryOf = (item) => {
    const newCount = item.new ? UNITS[item.new - 1].length : 0;
    return `新词 ${newCount} 个，旧词 ${item.total - newCount} 个`;
  };
  const nextTask = schedule.find((item) => item.studyDay && item.date >= today);
  let kicker = `今天 · ${shortDate(today)}`;
  let title, note;
  let target = nextTask ? nextTask.date : null;
  let label = "看今天的词";
  if (today < first) {
    kicker = `${shortDate(nextTask.date)} 开始`;
    title = `Day ${nextTask.studyDay}`;
    note = summaryOf(nextTask);
    label = "看第一天的词";
  } else if (today > last) {
    title = "全部完成";
    note = "计划已经走完了。";
  } else if (day.studyDay) {
    title = `Day ${day.studyDay}`;
    note = summaryOf(day);
  } else {
    title = day.rest ? "今天休息" : "今天已顺延";
    note = `下一次是 ${shortDate(nextTask.date)} 的 Day ${nextTask.studyDay}`;
    label = "看下一天的词";
  }
  const current = passed + (day && day.studyDay ? 1 : 0);
  $("hero-kicker").textContent = kicker;
  $("hero-title").textContent = title;
  $("hero-note").textContent = note;
  $("hero-bar").style.width = `${(current / total) * 100}%`;
  $("hero-progress").textContent = `第 ${current} / ${total} 天`;
  $("today-go").hidden = !target;
  $("today-go").textContent = `${label} ↓`;
  $("today-go").dataset.date = target || "";
}

function renderActions() {
  const day = byDate.get(selected);
  const button = $("postpone");
  button.disabled = Boolean(day.rest || day.skipped);
  button.textContent = day.rest ? "休息日不用顺延" : day.skipped ? "这天已顺延" : `顺延 ${shortDate(selected)}`;
  $("undo").disabled = skips.length === 0;
  const notes = [];
  if (skips.length) notes.push(`已顺延 ${skips.length} 天`);
  if (!storageWorks) notes.push("这个浏览器存不住顺延记录，关掉页面会丢");
  $("status").textContent = notes.join("，");
  $("range").textContent = `全程 ${first} 至 ${last}`;
}

function render() {
  renderMonth();
  renderDetail();
  renderActions();
  renderHero();
}

// 滑到词表。详情顶部留出了顺延按钮的高度
function scrollToDetail() {
  $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- 操作 ----------

$("grid").addEventListener("click", (event) => {
  const cell = event.target.closest("button.cell");
  if (!cell) return;
  selected = cell.dataset.date;
  render();
  scrollToDetail();
});
$("today-go").addEventListener("click", () => {
  selected = $("today-go").dataset.date;
  shown = monthIndex(selected);
  render();
  scrollToDetail();
});
$("prev").addEventListener("click", () => { shown--; renderMonth(); });
$("next").addEventListener("click", () => { shown++; renderMonth(); });

$("postpone").addEventListener("click", () => {
  skips.push(selected);
  saveSkips();
  refreshSchedule();
  render();
});

$("undo").addEventListener("click", () => {
  const undone = skips.pop();
  saveSkips();
  refreshSchedule();
  // 跳到刚恢复的那天，方便确认。它在别的月份时，月份也跟着切过去
  selected = undone;
  shown = monthIndex(selected);
  render();
});

// ---------- 使用指南和更新记录 ----------

const GUIDE_HTML = `
  <h3>每天看什么</h3>
  <p>点日历上的某一天（默认今天），下面会显示当天的新词、故事和要复习的旧词。灰色是休息日。</p>
  <h3>怎么背</h3>
  <p>用什么方式背都可以。故事只是参考，不喜欢可以不用。</p>
  <h3>晚上听写</h3>
  <p>妈妈念中文，你写英文。写完把作答纸和念词单一起拍照，发给豆包或 DeepSeek 批改。</p>
  <h3>顺延</h3>
  <p>非特殊情况不顺延，每个月最多顺延一次。选中那天点顶部的「顺延」，这天和之后的任务全部后移一天；点错了按「撤销」。</p>
  <p>顺延记录只存在这个浏览器里，换手机或清除浏览器数据会丢。</p>`;

function openDialog(title, body) {
  $("dialog-title").textContent = title;
  $("dialog-body").innerHTML = body;
  $("dialog-body").scrollTop = 0;
  $("overlay").hidden = false;
  $("dialog-close").focus();
}

function logHtml(entries) {
  return entries.map((entry) => `<h3>${esc(entry.date)}</h3><ul>${entry.items.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`).join("");
}

function readSeenLog() {
  return localStorage.getItem(SEEN_LOG_KEY);
}

// 第一次打开看指南；之后只要有没看过的更新，就弹更新记录，新的在上面
function showWelcome() {
  let seen;
  try {
    seen = readSeenLog();
    localStorage.setItem(SEEN_LOG_KEY, String(UPDATE_LOG.length));
  } catch (error) {
    return;  // 存不住就不自动弹，否则每次打开都弹一遍。指南按钮还能用
  }
  if (seen === null) {
    openDialog("使用指南", GUIDE_HTML);
    return;
  }
  const fresh = UPDATE_LOG.slice(Number(seen) || 0).reverse();
  if (fresh.length) openDialog("更新了什么", logHtml(fresh));
}

$("guide").addEventListener("click", () => openDialog("使用指南", GUIDE_HTML));
$("dialog-close").addEventListener("click", () => { $("overlay").hidden = true; });

render();
showWelcome();
</script>
</body>
</html>
